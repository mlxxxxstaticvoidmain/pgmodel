[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgmodel"
version = "0.1.0"
description = "A small async PostgreSQL query builder based on Python table classes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["asyncpg>=0.29,<1"]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]

[tool.setuptools]
packages = ["pgmodel"]
